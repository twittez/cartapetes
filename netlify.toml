[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirecionamentos e Proxies do Netlify
[[redirects]]
  from = "/beehive-api/*"
  to = "https://api.conta.paybeehive.com.br/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/meta-capi"
  to = "/.netlify/functions/meta-capi"
  status = 200

[[redirects]]
  from = "/beehive-webhook"
  to = "/.netlify/functions/beehive-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
